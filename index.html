<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="이미지를 불꽃으로 변환하는 Firework Canvas" />
  <title>Firework Canvas</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><p>IMAGE TO FIREWORK</p><h1>Firework Canvas</h1></header>
    <section class="workspace" aria-label="Firework Canvas 작업 영역">
      <section class="convert-panel" aria-labelledby="convert-title">
        <div class="canvas-stage">
          <canvas id="fireworkCanvas" width="900" height="700" aria-label="Convert Firework Canvas"></canvas>
          <div class="canvas-label" id="canvasLabel"><span>✦</span><h2 id="convert-title">Convert Firework Canvas</h2><p>업로드한 이미지를 이곳에서 확인합니다.</p></div>
        </div>
        <div class="launch-marker-area" id="launchMarkerArea" aria-label="Launch Point Marker 영역"></div>
      </section>
      <aside class="settings-panel" aria-label="Firework 설정">
        <section class="upload-preview" aria-label="Upload Image">
          <p class="upload-rules">JPG, PNG 또는 WebP · 최대 10MB</p>
          <div class="upload-actions"><button class="button button-secondary" id="uploadButton" type="button">Upload</button><button class="button button-secondary" id="deleteButton" type="button" disabled>Delete</button></div>
          <div class="preview-image-stage" id="previewImageStage" hidden><canvas id="imagePreviewCanvas" width="340" height="205" aria-label="업로드 이미지 편집 미리보기"></canvas></div>
          <p class="error-message" id="errorMessage" role="alert" hidden></p>
          <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden />
        </section>
        <fieldset class="control-group framing-controls" id="framingControls" hidden><legend>Image Framing</legend><div class="option-row"><button class="option-button is-selected" type="button" data-crop-shape="rect">Rectangle</button><button class="option-button" type="button" data-crop-shape="circle">Circle</button></div><label class="zoom-control" for="zoomRange">Zoom <input id="zoomRange" type="range" min="1" max="2.5" step="0.05" value="1" /></label><p class="framing-hint">미리보기를 드래그해 위치를 조정하세요.</p></fieldset>
        <fieldset class="control-group composition-controls" id="compositionControls" hidden><legend>Firework Position</legend><label class="composition-scale" for="compositionScale"><span>Scale</span><output id="compositionScaleValue" for="compositionScale">100%</output><input id="compositionScale" type="range" min="0.6" max="1.35" step="0.05" value="1" /></label><div class="composition-actions"><p class="framing-hint">Convert Canvas를 드래그해 위치를 조정하세요.</p><button class="button button-secondary composition-reset" id="compositionReset" type="button">Reset</button></div></fieldset>
        <fieldset class="control-group"><legend>Color</legend><div class="option-row"><button class="option-button is-selected" type="button" data-color-mode="original">Original</button><button class="option-button" type="button" data-color-mode="palette">Palette</button><button class="option-button" type="button" data-color-mode="pick">Pick</button></div><div class="palette-swatches" id="paletteSwatches" aria-label="추출된 Palette 색상" hidden></div><div class="picked-color" id="pickedColorDisplay" hidden><span class="palette-swatch" id="pickedColorSwatch"></span><span id="pickedColorValue"></span></div></fieldset>
        <fieldset class="control-group"><legend>Particles</legend><div class="option-row"><button class="option-button" type="button" data-particle-mode="low">Low</button><button class="option-button is-selected" type="button" data-particle-mode="normal">Normal</button><button class="option-button" type="button" data-particle-mode="high">High</button></div></fieldset>
        <div class="paired-controls"><fieldset class="control-group"><legend>Duration</legend><div class="option-row"><button class="option-button" type="button" data-duration="3">3s</button><button class="option-button is-selected" type="button" data-duration="5">5s</button></div></fieldset><fieldset class="control-group"><legend>Ratio</legend><div class="option-row"><button class="option-button is-selected" type="button" data-ratio="1:1">1:1</button><button class="option-button" type="button" data-ratio="3:4">3:4</button><button class="option-button" type="button" data-ratio="4:3">4:3</button></div></fieldset></div>
        <fieldset class="control-group"><legend>Launch Points</legend><div class="option-row"><button class="option-button is-selected" type="button" data-launch-count="1">1</button><button class="option-button" type="button" data-launch-count="2">2</button><button class="option-button" type="button" data-launch-count="3">3</button><button class="option-button" type="button" data-launch-count="4">4</button><button class="option-button" type="button" data-launch-count="5">5</button></div></fieldset>
      </aside>
    </section>
    <div class="main-actions"><button class="button button-preview" id="previewButton" type="button">▶ Preview</button><button class="button button-save" type="button">↓ Save Video</button></div>
    <p class="preview-status" id="previewStatus" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="js/app.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/image.js"></script>
  <script src="js/fireworks.js"></script>
</body>
</html>
